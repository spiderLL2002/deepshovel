name: Reproduce paper artifact
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/reproduce.py --output runs/core
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-linux
          path: runs/core
  extended:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r repro/requirements.lock
      - run: python scripts/reproduce.py --extended --output runs/extended
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extended-${{ matrix.os }}
          path: runs/extended
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies for the offline cross-language fixture
        run: |
          python -m venv compiler/.venv
          compiler/.venv/bin/python -m pip install -r repro/requirements.lock pytest==8.4.2
      - run: npm run install:ci
      - run: npm run contract:check
      - run: npm run build
      - run: npm run test:node
